# SentinelAI - core platform (assistant-service, Redis and Ollama intentionally excluded)
#   cp .env.example .env && docker compose up -d --build

x-go-env: &go-env
  DB_HOST: mariadb
  DB_PORT: "3306"
  DB_USER: sentinel
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?set INTERNAL_SERVICE_KEY in .env}
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  EXCHANGE_NAME: sentinelai.events

x-go-service: &go-service
  restart: on-failure   # services don't retry DB/RabbitMQ connections on their own
  networks: [sentinel]

services:
  # ---------------------------------------------------------------- infra
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_USER: sentinel
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [sentinel]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports:
      - "15672:15672"   # management UI (guest/guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks: [sentinel]

  # ------------------------------------------------------------- backend
  auth-service:
    <<: *go-service
    build: { context: ./backend, dockerfile: auth-service/Dockerfile }
    environment:
      <<: *go-env
      DB_NAME: auth_db
      SERVER_PORT: "8081"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      mariadb: { condition: service_healthy }
    healthcheck: &hc
      test: ["CMD-SHELL", "wget -qO- http://localhost:$$SERVER_PORT/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  camera-service:
    <<: *go-service
    build: { context: ./backend, dockerfile: camera-service/Dockerfile }
    environment:
      <<: *go-env
      DB_NAME: camera_db
      SERVER_PORT: "8082"
    depends_on:
      mariadb: { condition: service_healthy }
    healthcheck: *hc

  incident-service:
    <<: *go-service
    build: { context: ./backend, dockerfile: incident-service/Dockerfile }
    environment:
      <<: *go-env
      DB_NAME: incident_db
      SERVER_PORT: "8083"
    depends_on:
      mariadb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *hc

  analytics-worker:
    <<: *go-service
    build: { context: ./backend, dockerfile: analytics-worker/Dockerfile }
    environment:
      <<: *go-env
      DB_NAME: analytics_db
      SERVER_PORT: "8086"
      QUEUE_NAME: analytics.events
    depends_on:
      mariadb: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck: *hc

  notification-worker:
    <<: *go-service
    build: { context: ./backend, dockerfile: notification-worker/Dockerfile }
    environment:
      <<: *go-env
      SERVER_PORT: "8085"
      QUEUE_NAME: notification-worker.events
    ports:
      - "8085:8085"   # WebSocket: the frontend connects to ws://localhost:8085
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck: *hc

  decision-engine:
    <<: *go-service
    build: { context: ./backend, dockerfile: decision-engine/Dockerfile }
    environment:
      <<: *go-env
      QUEUE_NAME: decision-engine.detections
      ROUTING_KEY: "detection.#"
      COOLDOWN_SECONDS: "300"
      INCIDENT_SERVICE_URL: http://incident-service:8083
    depends_on:
      rabbitmq: { condition: service_healthy }
      incident-service: { condition: service_healthy }

  api-gateway:
    <<: *go-service
    build: { context: ./backend, dockerfile: api-gateway/Dockerfile }
    environment:
      GATEWAY_PORT: "8080"
      AUTH_SERVICE_URL: http://auth-service:8081
      CAMERA_SERVICE_URL: http://camera-service:8082
      INCIDENT_SERVICE_URL: http://incident-service:8083
      ANALYTICS_SERVICE_URL: http://analytics-worker:8086
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CORS_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      CORS_ALLOWED_HEADERS: Content-Type,Authorization
      CORS_ALLOW_CREDENTIALS: "true"
    ports:
      - "8080:8080"
    depends_on:
      auth-service:     { condition: service_healthy }
      camera-service:   { condition: service_healthy }
      incident-service: { condition: service_healthy }
      analytics-worker: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------- AI + video
  ai-service:
    build: ./ai-service
    restart: on-failure
    environment:
      CAMERA_SERVICE_URL: http://camera-service:8082
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      EXCHANGE_NAME: sentinelai.events
      MAX_CAMERAS: ${MAX_CAMERAS:-3}
      MJPEG_PORT: "8091"
    volumes:
      - ./videos:/videos:ro                       # camera sources, e.g. /videos/lobby.mp4
      - ./ai-service/runs:/app/runs:ro            # weapon_detector_v4/weights/best.pt
    ports:
      - "8091:8091"                               # annotated MJPEG streams
    depends_on:
      rabbitmq:       { condition: service_healthy }
      camera-service: { condition: service_healthy }
    networks: [sentinel]

  video-server:   # optional: range-request video server for the frontend (serve_videos.py)
    build: ./ai-service
    working_dir: /videos
    command: ["python", "/app/serve_videos.py", "8090"]
    volumes:
      - ./videos:/videos:ro
    ports:
      - "8090:8090"
    networks: [sentinel]

  # ------------------------------------------------------------ frontend
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_AI_STREAM_BASE_URL: ${VITE_AI_STREAM_BASE_URL:-http://localhost:8091}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on: [api-gateway]
    networks: [sentinel]

networks:
  sentinel:

volumes:
  mariadb-data:
  rabbitmq-data:
